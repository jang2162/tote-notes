[package]
name = "tote"
version = "0.1.0"
description = "tote-notes: a light notes app that keeps everything as you left it"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library apart from the `tote` binary (cargo#8519 on Windows).
name = "tote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
thiserror = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
memchr = "2"
# Snapshot folders are named in local time (src/backup).
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "macros"] }
# Outside changes to open workspaces and external files (src/watch).
notify = "8"
# Workspace search (src/search): ripgrep's searcher and regex matcher, without the rest of
# the `grep` umbrella crate (printer, CLI helpers).
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# Saved shortcuts are checked with the parser `MenuItem::set_accelerator` uses (src/shortcuts.rs):
# tauri does not re-export `Accelerator`. The version tauri already pulls in.
muda = { version = "0.20", default-features = false }

# Answers macOS's 「may tote quit?」 (src/app/lifecycle.rs), and takes a shortcut off a menu bar
# item muda leaves it on (src/app/key_equivalents.rs). The versions tao already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

# tests/menu_keypad.rs presses keys on a real AppKit menu: it makes the key events.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphicsContext"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }

# Builds a real AppKit menu bar, so it has to run on the main thread: no test harness.
[[test]]
name = "menu_key_equivalents"
harness = false

# The same, and presses keys on it.
[[test]]
name = "menu_keypad"
harness = false

# No `panic = "abort"`: with unwinding a panicking command fails alone, while abort would take the
# whole app — and every unsaved edit in it — down with it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The build the performance measurement runs (scripts/measure-perf.sh, tests/measure/perf.md):
# release optimisation, with tote's own `cfg!(debug_assertions)` on so `TOTE_BACKGROUND` and the
# `tote-dev` data folders apply. Dependencies keep theirs off — tauri, wry and tao have debug-only
# branches that would make it something other than the release build.
[profile.perf]
inherits = "release"
debug-assertions = true

[profile.perf.package."*"]
debug-assertions = false
