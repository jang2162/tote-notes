# 에이전트 지침 원본은 이 디렉터리다. CLAUDE.md, AGENTS.md 와 각 에이전트의 스킬 경로는
# `ruler apply` 가 만든다. 생성물은 직접 고치지 않는다.
default_agents = ["claude", "codex"]
nested = false

[gitignore]
enabled = true

[mcp_servers.codegraph]
command = "npx"
args = ["-y", "@colbymchenry/codegraph", "serve", "--mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
