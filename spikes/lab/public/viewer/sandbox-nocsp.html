<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <video id="v" muted playsinline preload="auto" width="320"></video>
    <img id="i" alt="" />
    <script>
      const log = { cspViolations: [], ipcProbeAttempts: [] };

      // Collected first so a blocked probe can be told apart from a CORS failure after the request left.
      addEventListener("securitypolicyviolation", (e) => {
        log.cspViolations.push({
          violatedDirective: e.violatedDirective,
          blockedURI: e.blockedURI,
        });
      });

      function progress() {
        parent.postMessage({ type: "progress", log }, "*");
      }

      function wait(el, eventName, ms) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error(eventName + " timeout")), ms);
          el.addEventListener(
            eventName,
            () => {
              clearTimeout(timer);
              resolve();
            },
            { once: true },
          );
          el.addEventListener(
            "error",
            () => {
              clearTimeout(timer);
              reject(new Error(eventName + " error " + (el.error ? el.error.code : "")));
            },
            { once: true },
          );
        });
      }

      function ranges(timeRanges) {
        const out = [];
        for (let k = 0; k < timeRanges.length; k++)
          out.push([timeRanges.start(k), timeRanges.end(k)]);
        return out;
      }

      // The invoke key is unknown to a sandboxed frame, so every attempt carries none or a wrong one.
      // A command that still ran would print "[ipc-probe] reached source=frame..." in the Rust log.
      function probeNativeIpc() {
        log.webkitIpcHandler = typeof window.webkit?.messageHandlers?.ipc;
        if (log.webkitIpcHandler === "undefined") return;
        const body = (key) => {
          const m = {
            cmd: "ipc_probe",
            callback: 1,
            error: 2,
            payload: { source: "frame-webkit" },
            options: {},
          };
          if (key !== null) m.__TAURI_INVOKE_KEY__ = key;
          return JSON.stringify(m);
        };
        for (const [name, key] of [
          ["webkit postMessage, wrong invoke key", "wrong-key"],
          ["webkit postMessage, no invoke key", null],
        ]) {
          try {
            window.webkit.messageHandlers.ipc.postMessage(body(key));
            log.ipcProbeAttempts.push(name + ": posted");
          } catch (e) {
            log.ipcProbeAttempts.push(name + ": threw " + e.name);
          }
        }
      }

      async function probeIsolation() {
        log.origin = String(self.origin);
        log.tauriInternalsInFrame = typeof window.__TAURI_INTERNALS__;
        if (window.__TAURI_INTERNALS__) {
          try {
            await window.__TAURI_INTERNALS__.invoke("lab_env");
            log.ipcInvoke = "reachable";
          } catch (e) {
            log.ipcInvoke = "blocked: " + e;
          }
        }
        try {
          log.parentAccess = typeof window.parent.document;
        } catch (e) {
          log.parentAccess = "blocked: " + e.name;
        }
        probeNativeIpc();
        try {
          await fetch("ipc://localhost/ipc_probe", {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json",
              "Tauri-Callback": "1",
              "Tauri-Error": "2",
              "Tauri-Invoke-Key": "wrong-key",
            },
            body: JSON.stringify({ source: "frame-fetch" }),
            signal: AbortSignal.timeout(5000),
          });
          log.ipcFetch = "reachable";
        } catch (e) {
          log.ipcFetch = "blocked: " + e.name;
        }
        log.ipcProbeAttempts.push(
          "fetch ipc://localhost/ipc_probe, no-cors, wrong Tauri-Invoke-Key: " + log.ipcFetch,
        );
        try {
          await fetch("https://example.com/", {
            mode: "no-cors",
            signal: AbortSignal.timeout(5000),
          });
          log.networkFetch = "reachable";
        } catch (e) {
          log.networkFetch = "blocked: " + e.name;
        }
        progress();
      }

      async function run(videoUrl, imageUrl) {
        await probeIsolation();
        const v = document.getElementById("v");
        try {
          v.src = videoUrl;
          await wait(v, "loadedmetadata", 15000);
          log.videoDuration = v.duration;
          log.videoBufferedBeforeSeek = ranges(v.buffered);
          log.videoSeekableBeforeSeek = ranges(v.seekable);
          progress();
          const target = v.duration * 0.8;
          v.currentTime = target;
          await wait(v, "seeked", 15000);
          log.videoSeekedTo = v.currentTime;
          log.videoSeekOk = Math.abs(v.currentTime - target) < 1;
          log.videoReadyState = v.readyState;
          log.videoBufferedAfterSeek = ranges(v.buffered);
        } catch (e) {
          log.videoError = String(e.message || e);
        }
        progress();
        if (imageUrl) {
          const i = document.getElementById("i");
          try {
            i.src = imageUrl;
            await wait(i, "load", 10000);
            log.imageSize = [i.naturalWidth, i.naturalHeight];
          } catch (e) {
            log.imageError = String(e.message || e);
          }
        }
        parent.postMessage({ type: "result", result: log }, "*");
      }

      addEventListener("message", (e) => {
        if (e.data && e.data.type === "init") run(e.data.videoUrl, e.data.imageUrl);
      });
      parent.postMessage({ type: "ready" }, "*");
    </script>
  </body>
</html>
